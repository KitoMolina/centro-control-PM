<title>Centro de Control PM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabecera con marca, pestañas tipo píldora, tarjetas blancas muy redondeadas sobre fondo verdoso claro, una banda azul marino como contraste. */
:root{
  --bg:#EEF5F6; --panel:#FFFFFF; --panel2:#E8F1F3; --ink:#0B3A52; --muted:#5F7C88; --line:#DCE8EB;
  --accent:#2A8F9C; --accent-ink:#FFFFFF; --accent-soft:#DDEFF1; --navy:#0B3A52; --navy-ink:#E6F3F5;
  --ok:#17784A; --ok-soft:#D9F0E3; --warn:#9A5B00; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#FADAD6;
  --shadow:0 1px 2px rgba(11,58,82,.04),0 12px 32px rgba(11,58,82,.07); --shadow-up:0 2px 4px rgba(11,58,82,.05),0 22px 44px rgba(11,58,82,.13);
  --f-display:'Plus Jakarta Sans',system-ui,sans-serif; --f-body:'Plus Jakarta Sans',system-ui,sans-serif; --f-mono:'Plus Jakarta Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071B25; --panel:#0D2B39; --panel2:#12384A; --ink:#E3F1F4; --muted:#8FB0BB; --line:#1C4455;
  --accent:#4DB6C4; --accent-ink:#05222A; --accent-soft:#123F4B; --navy:#0A3A50; --navy-ink:#E3F1F4;
  --ok:#5BD08F; --ok-soft:#153A29; --warn:#F0B44C; --warn-soft:#3F2E0E; --bad:#FF8A80; --bad-soft:#47201D;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.28); --shadow-up:0 2px 4px rgba(0,0,0,.25),0 22px 44px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071B25; --panel:#0D2B39; --panel2:#12384A; --ink:#E3F1F4; --muted:#8FB0BB; --line:#1C4455;
  --accent:#4DB6C4; --accent-ink:#05222A; --accent-soft:#123F4B; --navy:#0A3A50; --navy-ink:#E3F1F4;
  --ok:#5BD08F; --ok-soft:#153A29; --warn:#F0B44C; --warn-soft:#3F2E0E; --bad:#FF8A80; --bad-soft:#47201D;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.28); --shadow-up:0 2px 4px rgba(0,0,0,.25),0 22px 44px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{
  background:linear-gradient(118deg,transparent 62%,color-mix(in srgb,var(--accent) 6%,transparent) 62%,color-mix(in srgb,var(--accent) 6%,transparent) 84%,transparent 84%) no-repeat,var(--bg);
  color:var(--ink);font:14px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;padding:30px 0 20px}
.brand{font:700 22px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.brand::before{content:"";width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--navy));flex:none;box-shadow:inset -9px 0 0 rgba(255,255,255,.18)}
.brand small{display:block;font:600 10.5px/1.4 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctl label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:28px;padding:5px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:max-content;max-width:100%;scrollbar-width:none}
nav button{flex:none;background:none;border:0;border-radius:10px;color:var(--muted);font:600 14px var(--f-body);padding:9px 18px;cursor:pointer;transition:background .2s,color .2s}
nav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav button:not([aria-current]):hover{color:var(--ink);background:var(--accent-soft)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:100%;transition:border-color .2s,box-shadow .2s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
input[type=file]{padding:7px}
textarea{resize:vertical;min-height:80px}
.ctl select,.ctl input{width:auto;box-shadow:var(--shadow)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,var(--navy));box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.panel{position:relative;background-color:var(--panel);border-radius:20px;padding:28px;min-width:0;box-shadow:var(--shadow);transition:box-shadow .3s}
.panel:hover,.kpi:hover{background-image:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%)}
.panel h2{font:600 22px/1.25 var(--f-display);margin:0 0 18px;letter-spacing:-.02em}
.panel h2 span{font:500 12px var(--f-body);color:var(--muted);margin-left:10px;letter-spacing:0}
h2[data-eb]::before{content:attr(data-eb);display:block;font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:20px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px;perspective:900px}
.kpi{background-color:var(--panel);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .25s ease-out,box-shadow .3s;will-change:transform}
.kpi:hover{box-shadow:var(--shadow-up);--ty:-4px}
.kpi .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:600 36px/1.1 var(--f-display);margin-top:10px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:6px}
.kpi .l::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:8px;vertical-align:1px}
.kpi.ok .l::before{background:#3FB67A} .kpi.warn .l::before{background:#E8A93B} .kpi.bad .l::before{background:#E5675C}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:-4px 0 20px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.kpis .kpi:first-child{background-color:var(--navy);color:var(--navy-ink)}
.kpis .kpi:first-child .l,.kpis .kpi:first-child .s{color:color-mix(in srgb,var(--navy-ink) 68%,transparent)}
.kpis .kpi:first-child .v{color:#fff}
.kpis .kpi:first-child:hover{background-image:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(77,182,196,.28),transparent 70%)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel2);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--accent-soft)}
td.n,th.n{text-align:right;font-weight:500}
a{color:var(--accent);font-weight:600;text-decoration:none} a:hover{text-decoration:underline}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.tools .grow{flex:1 1 200px}
.tools label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 15px;cursor:pointer;font-size:13px;font-weight:500;transition:transform .2s,background .2s,border-color .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 20px var(--f-display);margin-bottom:8px;letter-spacing:-.02em}
.up{color:var(--bad)} .down{color:var(--ok)}
.flag{font-weight:700}
.note{color:var(--muted);font-size:12.5px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 16px;margin-bottom:20px;font-weight:600}
.list{display:flex;flex-direction:column}
.list .row{display:flex;justify-content:space-between;gap:12px;padding:12px 10px;margin:0 -10px;border-bottom:1px solid var(--line);align-items:center;border-radius:12px;transition:background .2s,transform .2s}
.list .row.click:hover{background:var(--accent-soft);transform:translateX(4px)}
.list .row:last-child{border-bottom:0}
.list .row>div{min-width:0}
.list .sub{font-size:12px;color:var(--muted)}
.panel.dark{background-color:var(--navy);color:var(--navy-ink)}
.panel.dark h2{color:#fff}
.panel.dark h2 span,.panel.dark .sub,.panel.dark .note{color:color-mix(in srgb,var(--navy-ink) 66%,transparent)}
.panel.dark .list .row{border-color:rgba(255,255,255,.12)}
.panel.dark .list .row.click:hover{background:rgba(255,255,255,.07)}
.panel.dark .empty,.panel.dark .empty b{color:var(--navy-ink)}
.panel.dark:hover{background-image:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(77,182,196,.22),transparent 70%)}
#modal{position:fixed;inset:0;background:rgba(5,25,36,.6);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#modal.open{display:flex}
.dlg{background:var(--panel);border-radius:24px;width:100%;max-width:740px;padding:30px;margin:auto;box-shadow:var(--shadow-up)}
.dlg h2{font:600 24px var(--f-display);letter-spacing:-.02em;margin:0 0 18px}
.form{display:grid;gap:14px 14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.form label input,.form label select,.form label textarea{text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;color:var(--ink)}
.form h3{grid-column:1/-1;margin:12px 0 0;font:600 10.5px var(--f-body);color:var(--accent);letter-spacing:.12em;text-transform:uppercase;padding-top:14px;border-top:1px solid var(--line)}
.form h3:first-child{border-top:0;padding-top:0;margin-top:0}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:12px 20px;border-radius:12px;z-index:60;display:none;max-width:90vw;font-weight:500;box-shadow:var(--shadow-up)}
#toast.on{display:block}
svg text{fill:var(--muted);font:500 11px var(--f-body)}
.bars rect{fill:var(--accent);transition:opacity .2s,transform .2s;transform-box:fill-box;transform-origin:bottom} .bars rect.old{fill:var(--accent-soft)}
.bars rect:hover{opacity:.8;transform:scaleY(1.04)}
.hint{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:640px){
  header{align-items:stretch}
  .ctl{width:100%} .ctl label{flex:1 1 140px} .ctl select,.ctl input{width:100%}
  nav{width:100%} nav button{flex:1 0 auto;padding:10px 14px}
  .tw{border:0;overflow:visible}
  .tw table,.tw tbody,.tw tr,.tw td{display:block;width:100%}
  .tw thead{display:none}
  .tw tr{background:var(--panel2);border-radius:14px;padding:8px 14px;margin-bottom:10px}
  .tw td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 0;border:0;white-space:normal;text-align:right}
  .tw td::before{content:attr(data-label);color:var(--muted);font:600 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;text-align:left;flex:none}
  .tw tbody tr.click:hover td{background:none}
  .tools>*,.tools .btn{flex:1 1 100%} .tools h2{flex:1 1 100%!important}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-right:-20px;padding-right:20px;scrollbar-width:none} .chip{flex:none}
  .acts .btn{flex:1 1 auto}
  .btn,.chip,nav button,input,select{min-height:42px}
  .list .row{padding:12px 4px;margin:0}
}
@media (max-width:520px){.kpi .v{font-size:28px}.dlg{padding:20px}.panel{padding:20px}header{padding-top:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.kpi{transform:none!important}}
@media (hover:none){.kpi{transform:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">Centro de control<small>Property management · Miami-Dade</small></div>
    <div class="ctl">
      <label>Edificio<select id="f-bld"></select></label>
      <label>Mes<input type="month" id="f-month"></label>
    </div>
  </header>
  <nav id="nav" aria-label="Módulos"></nav>
  <div id="err"></div>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){if(typeof v==='number')return isFinite(v)?v:0;if(v==null)return 0;var s=String(v).trim();var neg=/^\(.*\)$/.test(s)||/^-/.test(s);var n=parseFloat(s.replace(/[^0-9.]/g,''));return isNaN(n)?0:(neg?-n:n)};
var money=function(n){n=Math.round((n||0)*100)/100;return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})};
var pad=function(n){return String(n).padStart(2,'0')};
var todayD=new Date();
var TODAY=todayD.getFullYear()+'-'+pad(todayD.getMonth()+1)+'-'+pad(todayD.getDate());
var utc=function(iso){var p=iso.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])};
var daysTo=function(iso){return iso?Math.round((utc(iso)-utc(TODAY))/864e5):null};
var fmtD=function(iso){if(!iso)return '—';return new Date(utc(iso)).toLocaleDateString('es-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})};
var monthLabel=function(m){var p=m.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,1)).toLocaleDateString('es-US',{month:'short',year:'2-digit',timeZone:'UTC'})};
var addMonths=function(m,k){var p=m.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1+k,1));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)};
var addDays=function(k){var d=new Date(utc(TODAY)+k*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
var rid=function(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var ORG='principal';
var CATS=['Agua y alcantarillado','Electricidad áreas comunes','Gas','Basura','Seguro','Mantenimiento y reparaciones','Limpieza','Jardinería','Control de plagas','Ascensor','Alarma y protección contra incendios','Impuestos','Honorarios y administración','Legal','Otros'];
var AGENCIES=['WBPHA','PBCHA','Miami-Dade PHCD','Hialeah Housing Authority','Housing Authority of Miami Beach','Citrus Health Network','Health Council of South Florida'];
var PORTAL=['SI','Invitado','NO'];
var RENEW=['','Pendiente','Enviada','Firmada en Buildium'];

var S={buildings:{},tenants:{},invoices:{}};
var ui={view:'resumen',bld:'all',month:TODAY.slice(0,7),q:'',tf:'todos',cf:'urgentes',iq:'',igroup:'categoria',thr:15,loaded:false};
var db=null,assets=null,downloads=null,canWrite=true,memOnly=false;
var VIEWS=[['resumen','Resumen'],['facturas','Facturas'],['inquilinos','Inquilinos'],['contratos','Contratos'],['datos','Datos']];

/* ---------- datos ---------- */
function list(col){return Object.keys(S[col]).map(function(id){return Object.assign({},S[col][id],{id:id})})}
function bName(id){var b=S.buildings[id];return b?b.name:'—'}
function visTenants(){return list('tenants').filter(function(t){return ui.bld==='all'||t.building===ui.bld})}
function visInvoices(){return list('invoices').filter(function(i){return ui.bld==='all'||i.building===ui.bld})}
function put(col,id,data){
  data.org=ORG;
  if(memOnly||!db){S[col][id]=data;sched();return Promise.resolve()}
  return db.doc(col+'/'+id).set(data).catch(function(e){toast(errMsg(e));throw e});
}
function del(col,id){
  if(memOnly||!db){delete S[col][id];sched();return Promise.resolve()}
  return db.doc(col+'/'+id).delete().catch(function(e){toast(errMsg(e))});
}
function errMsg(e){var c=e&&e.code;if(c==='invalid_argument')return 'No tenés permiso para editar estos datos.';if(c==='quota_exceeded')return 'Se llenó el límite de documentos.';if(c==='resource_exhausted')return 'Demasiadas operaciones seguidas, probá en unos segundos.';return 'No se pudo guardar. Probá de nuevo.'}
async function batchRun(items,fn,label){
  var done=0,i=0,total=items.length;
  async function worker(){while(i<total){var k=i++;try{await fn(items[k])}catch(e){}done++;if(done%5===0||done===total)toast(label+' '+done+'/'+total)}}
  await Promise.all([worker(),worker(),worker(),worker()]);
}
function tInfo(t){
  var bal=num(t.balance),d=t.leaseEnd?daysTo(t.leaseEnd):null,band;
  if(!t.leaseEnd)band='sin';else if(d<0)band='vencido';else if(d<=60)band='60';else if(d<=90)band='90';else if(d<=120)band='120';else band='vigente';
  return {bal:bal,days:d,band:band,crit:bal>1500,debe:bal>0}
}
var BAND_LABEL={sin:'Sin contrato',vencido:'Vencido','60':'≤ 60 días','90':'≤ 90 días','120':'≤ 120 días',vigente:'Vigente'};
var BAND_CLS={sin:'bad',vencido:'bad','60':'bad','90':'warn','120':'warn',vigente:'ok'};

/* ---------- render ---------- */
var raf=0;
function safeRender(){
  try{render()}catch(err){
    var v=document.getElementById('view');
    if(v)v.innerHTML='<div class="panel"><div class="empty"><b>Error al mostrar la página</b><code>'+esc(err&&err.message||err)+'</code></div></div>';
  }
}
function sched(){
  if(raf)return;
  var fire=function(){if(!raf)return;raf=0;safeRender()};
  raf=1;
  // rAF no corre si la pestaña o el marco está en segundo plano: el timeout asegura el dibujo.
  try{requestAnimationFrame(fire)}catch(e){}
  setTimeout(fire,60);
}
window.addEventListener('error',function(e){var b=document.getElementById('err');if(b)b.innerHTML='<div class="banner">Error: '+esc(e.message)+'</div>'});
window.addEventListener('unhandledrejection',function(e){var b=document.getElementById('err');if(b)b.innerHTML='<div class="banner">Error: '+esc(e.reason&&e.reason.message||e.reason)+'</div>'});
function toast(m){var t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=''},3200)}
function render(){
  var ae=document.activeElement,aid=ae&&ae.id&&ae.closest('#view')?ae.id:null,ss=null,se=null;
  if(aid&&ae.selectionStart!=null){ss=ae.selectionStart;se=ae.selectionEnd}
  // cabecera
  var sel=$('#f-bld'),bs=list('buildings').sort(function(a,b){return a.name.localeCompare(b.name)});
  var opts='<option value="all">Todos ('+bs.length+')</option>'+bs.map(function(b){return '<option value="'+esc(b.id)+'">'+esc(b.name)+'</option>'}).join('');
  if(sel.dataset.sig!==opts){sel.innerHTML=opts;sel.dataset.sig=opts}
  if(!S.buildings[ui.bld]&&ui.bld!=='all')ui.bld='all';
  sel.value=ui.bld;$('#f-month').value=ui.month;
  $('#nav').innerHTML=VIEWS.map(function(v){return '<button data-act="nav" data-v="'+v[0]+'"'+(ui.view===v[0]?' aria-current="page"':'')+'>'+v[1]+'</button>'}).join('');
  $('#banner').innerHTML=memOnly?'<div class="banner">Modo sin conexión a la base compartida: los cambios se pierden al cerrar la página.</div>':(!canWrite?'<div class="banner">Tenés acceso de solo lectura. Pedí permiso de edición para cargar datos.</div>':'');
  var html='';
  if(!ui.loaded)html='<div class="empty"><b>Cargando datos…</b></div>';
  else if(!bs.length&&ui.view!=='datos')html=emptyStart();
  else html=({resumen:vResumen,facturas:vFacturas,inquilinos:vInquilinos,contratos:vContratos,datos:vDatos})[ui.view]();
  $('#view').innerHTML=html;
  document.querySelectorAll('#view .tw table').forEach(function(tb){
    var hs=Array.prototype.map.call(tb.querySelectorAll('thead th'),function(t){return t.textContent});
    tb.querySelectorAll('tbody tr').forEach(function(tr){Array.prototype.forEach.call(tr.children,function(td,i){if(hs[i]!=null)td.setAttribute('data-label',hs[i])})});
  });
  if(aid){var n=document.getElementById(aid);if(n){n.focus();if(ss!=null&&n.setSelectionRange){try{n.setSelectionRange(ss,se)}catch(e){}}}}
}
function emptyStart(){
  return '<div class="panel"><div class="empty"><b>Todavía no hay edificios cargados</b>Empezá creando tu primer edificio (LLC), importando un rent roll, o cargá datos de ejemplo para probar cómo funciona.<div class="acts" style="justify-content:center"><button class="btn pri" data-act="new-bld">Agregar edificio</button><button class="btn" data-act="go-datos">Importar rent roll</button><button class="btn" data-act="demo">Cargar datos de ejemplo</button></div></div></div>';
}
function kpi(l,v,s,cls){return '<div class="kpi '+(cls||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+(s||'&nbsp;')+'</div></div>'}
function noRows(t,s){return '<div class="empty"><b>'+t+'</b>'+(s||'')+'</div>'}

function spendByMonth(inv){var m={};inv.forEach(function(i){var k=i.month||(i.date||'').slice(0,7);if(!k)return;m[k]=(m[k]||0)+num(i.amount)});return m}

function vResumen(){
  var T=visTenants(),I=visInvoices(),cur=ui.month,prev=addMonths(cur,-1);
  var occ=T.filter(function(t){return t.name});
  var units=0;list('buildings').forEach(function(b){if(ui.bld==='all'||b.id===ui.bld)units+=num(b.units)});
  var debt=0,crit=0,expected=0,paid=0,urg=0,sin=0;
  occ.forEach(function(t){var i=tInfo(t);if(i.debe)debt+=i.bal;if(i.crit)crit++;expected+=num(t.rent);paid+=num(t.paid);if(i.band==='vencido'||i.band==='60')urg++;if(i.band==='sin')sin++});
  var sp=spendByMonth(I),sc=sp[cur]||0,sprev=sp[prev]||0,dl=sprev?((sc-sprev)/sprev*100):null;
  var pct=expected?Math.round(paid/expected*100):0;
  var k='<div class="kpis">'+
    kpi('Deuda de inquilinos (N2C)',money(debt),crit+' con más de $1,500',crit?'bad':'')+
    kpi('Cobrado este mes',pct+'%',money(paid)+' de '+money(expected),pct>=90?'ok':'warn')+
    kpi('Contratos urgentes',String(urg+sin),urg+' vencidos o ≤60 días · '+sin+' sin contrato',(urg+sin)?'warn':'ok')+
    kpi('Gastos de '+monthLabel(cur),money(sc),dl==null?'Sin mes anterior para comparar':((dl>=0?'+':'')+dl.toFixed(0)+'% vs '+monthLabel(prev)),dl!=null&&dl>ui.thr?'warn':'')+
    kpi('Ocupación',units?Math.round(occ.length/units*100)+'%':String(occ.length),occ.length+(units?' de '+units+' unidades':' inquilinos'),'')+
  '</div><div class="legend"><span><i style="background:#3FB67A"></i>En orden</span><span><i style="background:#E8A93B"></i>Atender: cobrado bajo 90%, contratos por vencer o gastos que subieron más de '+ui.thr+'%</span><span><i style="background:#E5675C"></i>Urgente: hay deudas de más de $1,500</span></div>';
  // gráfico 6 meses
  var months=[];for(var k2=5;k2>=0;k2--)months.push(addMonths(cur,-k2));
  var vals=months.map(function(m){return sp[m]||0}),mx=Math.max.apply(null,vals.concat([1]));
  var svg='<svg viewBox="0 0 600 190" width="100%" role="img" aria-label="Gasto mensual"><g class="bars">';
  months.forEach(function(m,i){var h=Math.round(vals[i]/mx*120),x=20+i*95;
    svg+='<rect class="'+(m===cur?'cur':'old')+'" x="'+x+'" y="'+(140-h)+'" width="62" height="'+h+'" rx="3"/>'+
    '<text x="'+(x+31)+'" y="'+(132-h)+'" text-anchor="middle">'+(vals[i]?'$'+Math.round(vals[i]/1000*10)/10+'k':'')+'</text>'+
    '<text x="'+(x+31)+'" y="162" text-anchor="middle">'+monthLabel(m)+'</text>'});
  svg+='</g></svg>';
  var top=occ.filter(function(t){return tInfo(t).debe}).sort(function(a,b){return num(b.balance)-num(a.balance)}).slice(0,6);
  var ct=occ.map(function(t){return {t:t,i:tInfo(t)}}).filter(function(x){return x.i.band!=='vigente'}).sort(function(a,b){return (a.i.days==null?-9999:a.i.days)-(b.i.days==null?-9999:b.i.days)}).slice(0,6);
  var rec=occ.filter(function(t){var d=t.recertDate?daysTo(t.recertDate):null;return d!=null&&d<=60}).sort(function(a,b){return a.recertDate.localeCompare(b.recertDate)}).slice(0,6);
  function row(t,right,sub){return '<div class="row click" style="cursor:pointer" data-act="edit-t" data-id="'+t.id+'"><div><b>'+esc(t.name||'(sin nombre)')+'</b><div class="sub">'+esc(bName(t.building))+' · Unidad '+esc(t.unit)+(sub?' · '+sub:'')+'</div></div><div>'+right+'</div></div>'}
  return k+'<div class="grid two">'+
   '<div class="panel"><h2 data-eb="Gastos">Gasto mensual<span>facturas cargadas</span></h2>'+(Object.keys(sp).length?svg:noRows('Sin facturas todavía','Cargá facturas en la pestaña Facturas.'))+'</div>'+
   '<div class="panel"><h2 data-eb="Cobranza">Mayores deudas<span>N2C</span></h2><div class="list">'+(top.length?top.map(function(t){return row(t,'<span class="pill '+(tInfo(t).crit?'bad':'warn')+'">'+money(num(t.balance))+'</span>')}).join(''):noRows('Sin deudas','Todos al día.'))+'</div></div>'+
  '</div><div class="grid two">'+
   '<div class="panel dark"><h2 data-eb="Contratos">Contratos a atender</h2><div class="list">'+(ct.length?ct.map(function(x){return row(x.t,'<span class="pill '+BAND_CLS[x.i.band]+'">'+BAND_LABEL[x.i.band]+'</span>',x.t.leaseEnd?'vence '+fmtD(x.t.leaseEnd):'')}).join(''):noRows('Todo vigente','Ningún contrato cerca del vencimiento.'))+'</div></div>'+
   '<div class="panel"><h2 data-eb="Asistencia">Recertificaciones de asistencia<span>próximos 60 días</span></h2><div class="list">'+(rec.length?rec.map(function(t){return row(t,'<span class="pill acc">'+fmtD(t.recertDate)+'</span>',esc(t.assistAgency||t.assistProgram||''))}).join(''):noRows('Sin recertificaciones próximas','Cargá la fecha en la ficha del inquilino.'))+'</div></div>'+
  '</div>';
}

/* ---------- facturas ---------- */
function vFacturas(){
  var I=visInvoices(),cur=ui.month,months=[3,2,1,0].map(function(k){return addMonths(cur,-k)});
  var key=ui.igroup==='proveedor'?'vendor':'category';
  var agg={};I.forEach(function(i){var m=i.month||(i.date||'').slice(0,7);if(months.indexOf(m)<0)return;var g=i[key]||'Sin '+(key==='vendor'?'proveedor':'categoría');agg[g]=agg[g]||{};agg[g][m]=(agg[g][m]||0)+num(i.amount)});
  var groups=Object.keys(agg).sort(function(a,b){return (agg[b][cur]||0)-(agg[a][cur]||0)});
  var prev=addMonths(cur,-1),tot={};months.forEach(function(m){tot[m]=0});groups.forEach(function(g){months.forEach(function(m){tot[m]+=agg[g][m]||0})});
  function delta(c,p){if(!p&&!c)return '<td class="n">—</td>';if(!p)return '<td class="n"><span class="pill acc">nuevo</span></td>';var d=(c-p)/p*100,big=Math.abs(d)>ui.thr;return '<td class="n '+(big?(d>0?'up flag':'down flag'):'')+'">'+(d>0?'+':'')+d.toFixed(0)+'%'+(big?(d>0?' ▲':' ▼'):'')+'</td>'}
  var cmp='<div class="tw"><table><thead><tr><th>'+(key==='vendor'?'Proveedor':'Categoría')+'</th>'+months.map(function(m){return '<th class="n">'+monthLabel(m)+'</th>'}).join('')+'<th class="n">Δ vs '+monthLabel(prev)+'</th></tr></thead><tbody>'+
    groups.map(function(g){return '<tr><td>'+esc(g)+'</td>'+months.map(function(m){return '<td class="n">'+(agg[g][m]?money(agg[g][m]):'—')+'</td>'}).join('')+delta(agg[g][cur]||0,agg[g][prev]||0)+'</tr>'}).join('')+
    (groups.length?'<tr><td><b>Total</b></td>'+months.map(function(m){return '<td class="n"><b>'+money(tot[m])+'</b></td>'}).join('')+delta(tot[cur],tot[prev])+'</tr>':'')+
    '</tbody></table></div>';
  var q=ui.iq.toLowerCase();
  var rows=I.filter(function(i){return !q||((i.vendor||'')+' '+(i.category||'')+' '+(i.invNumber||'')).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
  var tbl='<div class="tw"><table><thead><tr><th>Fecha</th><th>Edificio</th><th>Proveedor</th><th>Categoría</th><th>Nº</th><th class="n">Monto</th><th>Estado</th><th>Archivo</th></tr></thead><tbody>'+
    rows.slice(0,300).map(function(i){return '<tr class="click" data-act="edit-i" data-id="'+i.id+'"><td>'+fmtD(i.date)+'</td><td>'+esc(bName(i.building))+'</td><td>'+esc(i.vendor)+'</td><td>'+esc(i.category)+'</td><td>'+esc(i.invNumber||'')+'</td><td class="n">'+money(num(i.amount))+'</td><td><span class="pill '+(i.status==='Pagada'?'ok':'warn')+'">'+esc(i.status||'Pendiente')+'</span></td><td>'+(i.file?'<a href="/_blob/'+esc(i.file)+'" target="_blank" rel="noopener" data-stop="1">Ver</a>':'<span class="note">—</span>')+'</td></tr>'}).join('')+'</tbody></table></div>'+(rows.length?'':noRows('Sin facturas en este filtro','Usá “Nueva factura” para cargar la primera.'));
  return '<div class="panel" style="margin-bottom:14px"><div class="tools"><h2 data-eb="Comparativa" style="margin:0;flex:1 1 220px">Comparativa mensual<span>últimos 4 meses</span></h2>'+
    '<label>Agrupar por<select data-ui="igroup" id="u-igroup"><option value="categoria"'+(key==='category'?' selected':'')+'>Categoría</option><option value="proveedor"'+(key==='vendor'?' selected':'')+'>Proveedor</option></select></label>'+
    '<label>Alertar sobre ±%<input type="number" min="1" max="200" id="u-thr" data-ui="thr" value="'+ui.thr+'" style="width:90px"></label></div>'+
    (groups.length?cmp:noRows('Sin datos para comparar','Cargá facturas de al menos dos meses para ver variaciones.'))+'</div>'+
    '<div class="panel"><div class="tools"><h2 data-eb="Registro" style="margin:0;flex:1 1 140px">Facturas<span>'+rows.length+'</span></h2><label class="grow">Buscar<input id="u-iq" data-ui="iq" value="'+esc(ui.iq)+'" placeholder="Proveedor, categoría, número"></label>'+
    '<button class="btn" data-act="exp-inv">Exportar CSV contable</button><button class="btn pri" data-act="new-i">Nueva factura</button></div>'+tbl+'</div>';
}

/* ---------- inquilinos ---------- */
function vInquilinos(){
  var T=visTenants(),q=ui.q.toLowerCase();
  var F={todos:function(){return true},debe:function(t){return tInfo(t).debe},critico:function(t){return tInfo(t).crit},noportal:function(t){return t.portal!=='SI'},sincontrato:function(t){return tInfo(t).band==='sin'||tInfo(t).band==='vencido'},asistencia:function(t){return !!(t.assistProgram&&t.assistProgram!=='Ninguna')}};
  var L={todos:'Todos',debe:'Con deuda',critico:'Deuda > $1,500',noportal:'No en portal',sincontrato:'Sin contrato vigente',asistencia:'Con asistencia'};
  var rows=T.filter(F[ui.tf]).filter(function(t){return !q||((t.name||'')+' '+(t.unit||'')+' '+bName(t.building)).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return bName(a.building).localeCompare(bName(b.building))||String(a.unit).localeCompare(String(b.unit),undefined,{numeric:true})});
  var chips='<div class="chips">'+Object.keys(L).map(function(k){return '<button class="chip" data-act="tf" data-v="'+k+'" aria-pressed="'+(ui.tf===k)+'">'+L[k]+(k==='todos'?' ('+T.length+')':'')+'</button>'}).join('')+'</div>';
  var tbl='<div class="tw"><table><thead><tr><th>Edificio</th><th>Unidad</th><th>Inquilino</th><th class="n">Renta</th><th class="n">Pagó</th><th class="n">Balance</th><th>Portal</th><th>Contrato</th><th>Asistencia</th></tr></thead><tbody>'+
   rows.slice(0,400).map(function(t){var i=tInfo(t);
    return '<tr class="click" data-act="edit-t" data-id="'+t.id+'"><td>'+esc(bName(t.building))+'</td><td>'+esc(t.unit)+'</td><td>'+esc(t.name||'Vacante')+'</td><td class="n">'+money(num(t.rent))+'</td><td class="n">'+money(num(t.paid))+'</td><td class="n"><span class="'+(i.crit?'up flag':(i.debe?'up':''))+'">'+money(i.bal)+'</span></td><td><span class="pill '+(t.portal==='SI'?'ok':(t.portal==='Invitado'?'warn':'bad'))+'">'+esc(t.portal||'NO')+'</span></td><td><span class="pill '+BAND_CLS[i.band]+'">'+(i.band==='vigente'||i.band==='sin'||i.band==='vencido'?BAND_LABEL[i.band]:fmtD(t.leaseEnd))+'</span></td><td>'+(t.assistProgram&&t.assistProgram!=='Ninguna'?'<span class="pill acc">'+esc(t.assistAgency||t.assistProgram)+'</span>':'<span class="note">—</span>')+'</td></tr>'}).join('')+'</tbody></table></div>'+(rows.length?'':noRows('Ningún inquilino coincide','Cambiá el filtro o agregá uno nuevo.'));
  return '<div class="panel"><div class="tools"><h2 data-eb="Registro" style="margin:0;flex:1 1 140px">Inquilinos<span>'+rows.length+'</span></h2><label class="grow">Buscar<input id="u-q" data-ui="q" value="'+esc(ui.q)+'" placeholder="Nombre, unidad o edificio"></label><button class="btn" data-act="go-datos">Importar rent roll</button><button class="btn pri" data-act="new-t">Nuevo inquilino</button></div>'+chips+tbl+'</div>';
}

/* ---------- contratos ---------- */
function vContratos(){
  var T=visTenants().filter(function(t){return t.name});
  var C={urgentes:'Urgentes',vencido:'Vencidos','60':'≤ 60 días','90':'≤ 90 días','120':'≤ 120 días',sin:'Sin contrato',todos:'Todos'};
  var data=T.map(function(t){return {t:t,i:tInfo(t)}});
  var cnt=function(k){return data.filter(function(x){return flt(k,x)}).length};
  function flt(k,x){return k==='todos'?true:k==='urgentes'?x.i.band!=='vigente':x.i.band===k}
  var rows=data.filter(function(x){return flt(ui.cf,x)}).sort(function(a,b){return (a.i.days==null?-9999:a.i.days)-(b.i.days==null?-9999:b.i.days)});
  var chips='<div class="chips">'+Object.keys(C).map(function(k){return '<button class="chip" data-act="cf" data-v="'+k+'" aria-pressed="'+(ui.cf===k)+'">'+C[k]+' ('+cnt(k)+')</button>'}).join('')+'</div>';
  var tbl='<div class="tw"><table><thead><tr><th>Edificio</th><th>Unidad</th><th>Inquilino</th><th>Inicio</th><th>Vence</th><th class="n">Días</th><th>Estado</th><th>Renovación</th><th>Documento</th></tr></thead><tbody>'+
   rows.slice(0,400).map(function(x){var t=x.t,i=x.i;
    return '<tr><td>'+esc(bName(t.building))+'</td><td>'+esc(t.unit)+'</td><td><a href="#inquilinos" data-act="edit-t" data-id="'+t.id+'">'+esc(t.name)+'</a></td><td>'+fmtD(t.leaseStart)+'</td><td>'+fmtD(t.leaseEnd)+'</td><td class="n">'+(i.days==null?'—':i.days)+'</td><td><span class="pill '+BAND_CLS[i.band]+'">'+BAND_LABEL[i.band]+'</span></td>'+
    '<td><select data-renew="'+t.id+'" id="r-'+t.id+'" style="width:auto">'+RENEW.map(function(r){return '<option value="'+esc(r)+'"'+((t.renewal||'')===r?' selected':'')+'>'+(r||'—')+'</option>'}).join('')+'</select></td>'+
    '<td>'+(t.leaseFile?'<a href="/_blob/'+esc(t.leaseFile)+'" target="_blank" rel="noopener">Ver PDF</a>':'<span class="note">sin archivo</span>')+'</td></tr>'}).join('')+'</tbody></table></div>'+(rows.length?'':noRows('Nada para mostrar','No hay contratos en esta categoría.'));
  return '<div class="panel"><div class="tools"><h2 data-eb="Seguimiento" style="margin:0;flex:1">Contratos y renovaciones<span>según fecha de vencimiento</span></h2></div>'+chips+tbl+'<p class="note">Las alertas se calculan contra la fecha de hoy ('+fmtD(TODAY)+'). Marcá “Firmada en Buildium” cuando el inquilino haya firmado en el portal.</p></div>';
}

/* ---------- datos ---------- */
function vDatos(){
  var bs=list('buildings').sort(function(a,b){return a.name.localeCompare(b.name)});
  var demo=list('tenants').concat(list('invoices'),bs).filter(function(x){return x.demo}).length;
  var brows=bs.map(function(b){var n=list('tenants').filter(function(t){return t.building===b.id&&t.name}).length;return '<tr class="click" data-act="edit-b" data-id="'+b.id+'"><td>'+esc(b.name)+'</td><td>'+esc(b.address||'')+'</td><td class="n">'+num(b.units)+'</td><td class="n">'+n+'</td></tr>'}).join('');
  return '<div class="grid two">'+
   '<div class="panel"><h2 data-eb="Entrada">Importar</h2><p class="note">Subí un rent roll o una lista de facturas en Excel (.xlsx) o CSV. Las columnas se reconocen por su nombre en inglés o español (Unit, Tenant, Rent, Balance, Lease End, Vendor, Amount…). Si la unidad ya existe, se actualiza.</p>'+
     '<div class="form"><label class="full">Rent roll de inquilinos<input type="file" id="imp-t" accept=".xlsx,.xls,.csv"></label><label class="full">Facturas<input type="file" id="imp-i" accept=".xlsx,.xls,.csv"></label>'+
     '<label class="full">Edificio por defecto para filas sin edificio<select id="imp-b">'+bs.map(function(b){return '<option value="'+b.id+'"'+(ui.bld===b.id?' selected':'')+'>'+esc(b.name)+'</option>'}).join('')+'</select></label></div>'+
     '<div class="acts" style="justify-content:flex-start"><button class="btn pri" data-act="do-imp-t">Importar inquilinos</button><button class="btn pri" data-act="do-imp-i">Importar facturas</button></div></div>'+
   '<div class="panel"><h2 data-eb="Salida">Exportar</h2><p class="note">Archivos CSV que abren en Excel o Google Sheets. Respetan el edificio elegido arriba.</p><div class="acts" style="justify-content:flex-start"><button class="btn" data-act="exp-inv">Facturas (contabilidad)</button><button class="btn" data-act="exp-ten">Inquilinos y cobranza</button><button class="btn" data-act="exp-con">Contratos</button></div>'+
     '<h2 data-eb="Pruebas" style="margin-top:28px">Datos de ejemplo</h2><p class="note">Genera edificios, inquilinos y facturas ficticias para probar el panel. Se pueden borrar sin tocar tus datos reales.</p><div class="acts" style="justify-content:flex-start"><button class="btn" data-act="demo">Cargar ejemplo</button>'+(demo?'<button class="btn bad" data-act="demo-clear">Borrar ejemplo ('+demo+')</button>':'')+'</div></div>'+
  '</div><div class="panel"><div class="tools"><h2 data-eb="Cartera" style="margin:0;flex:1">Edificios<span>'+bs.length+'</span></h2><button class="btn pri" data-act="new-bld">Agregar edificio</button></div>'+
   (bs.length?'<div class="tw"><table><thead><tr><th>Nombre / LLC</th><th>Dirección</th><th class="n">Unidades</th><th class="n">Con inquilino</th></tr></thead><tbody>'+brows+'</tbody></table></div>':noRows('Sin edificios','Agregá uno para empezar.'))+'</div>';
}

/* ---------- modales ---------- */
function openModal(h){var m=$('#modal');m.innerHTML='<div class="dlg">'+h+'</div>';m.className='open'}
function closeModal(){$('#modal').className='';$('#modal').innerHTML=''}
function fld(label,id,val,type,extra){return '<label>'+label+'<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+'></label>'}
function sel(label,id,opts,val,full){return '<label'+(full?' class="full"':'')+'>'+label+'<select id="'+id+'">'+opts.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(l||'—')+'</option>'}).join('')+'</select></label>'}

/* ---------- importar / exportar ---------- */
function parseCSV(text){
  var rows=[],r=[],c='',q=false;text=text.replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch===';'||ch==='\t'){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows;
}
async function readSheet(file){
  var n=file.name.toLowerCase();
  if(/\.csv$/.test(n)){return parseCSV(await file.text())}
  if(typeof XLSX==='undefined'){toast('No se pudo cargar el lector de Excel. Guardá el archivo como CSV.');return null}
  var wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
}
function toObjects(rows){
  var hi=0;for(var i=0;i<Math.min(rows.length,15);i++){if(rows[i].filter(function(c){return String(c).trim()!==''}).length>=3){hi=i;break}}
  var H=rows[hi].map(function(h){return String(h).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'')});
  return {H:H,rows:rows.slice(hi+1).filter(function(r){return r.some(function(c){return String(c).trim()!==''})})};
}
function colMap(H,alias){var m={};Object.keys(alias).forEach(function(k){var a=alias[k],idx=-1;for(var j=0;j<a.length&&idx<0;j++)idx=H.indexOf(a[j]);if(idx<0)for(var j2=0;j2<a.length&&idx<0;j2++){if(a[j2].length<4)continue;idx=H.findIndex(function(h){return h.indexOf(a[j2])>=0})}m[k]=idx});return m}
function pDate(v){
  if(v===''||v==null)return '';
  if(typeof v==='number'&&v>20000&&v<80000){var d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  var s=String(v).trim(),m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){var y=+m[3];if(y<100)y+=2000;return y+'-'+pad(m[1])+'-'+pad(m[2])}
  return '';
}
async function findBuilding(name,deflt,cache){
  if(!name)return deflt;
  var key=name.toLowerCase();if(cache[key])return cache[key];
  var f=list('buildings').find(function(b){return b.name.toLowerCase()===key});
  if(f){cache[key]=f.id;return f.id}
  var id=rid();await put('buildings',id,{name:name,units:0,address:''});cache[key]=id;return id;
}
async function importTenants(){
  var f=document.getElementById('imp-t').files[0];if(!f){toast('Elegí un archivo de inquilinos.');return}
  var rows=await readSheet(f);if(!rows)return;var o=toObjects(rows);
  var m=colMap(o.H,{unit:['unit','unitnumber','apt','apartment','unidad','suite'],name:['tenant','tenantname','resident','name','inquilino','nombre'],rent:['rent','marketrent','monthlyrent','renta','currentrent'],balance:['balance','balancedue','n2c','due','owed','deuda','amountdue'],paid:['paid','payments','pagado','amountpaid','received'],ls:['leasestart','leasefrom','startdate','from','inicio','movein'],le:['leaseend','leaseto','leaseexpiration','expiration','enddate','todate','vence','expires','leaseexpires'],bld:['building','property','edificio','llc'],phone:['phone','telefono','cell'],email:['email','correo'],hap:['hap','happaid','happortion','hapamount'],prog:['program','assistance','programa'],agency:['agency','housingauthority','pha']});
  if(m.unit<0&&m.name<0){toast('No encontré columnas de unidad o inquilino. Revisá los encabezados.');return}
  var dflt=gv('imp-b'),cache={},existing={};
  list('tenants').forEach(function(t){existing[t.building+'|'+String(t.unit).toLowerCase()]=t.id});
  var jobs=[],newN=0,updN=0;
  for(var r of o.rows){
    var cell=function(k){return m[k]>=0?r[m[k]]:''};
    var bid=await findBuilding(String(cell('bld')).trim(),dflt,cache);
    if(!bid){toast('Creá un edificio primero o elegí uno por defecto.');return}
    var unit=String(cell('unit')).trim(),key=bid+'|'+unit.toLowerCase(),prev=existing[key];
    var d=Object.assign({},prev?S.tenants[prev]:{portal:'NO',assistProgram:'Ninguna'},{building:bid,unit:unit});
    if(m.name>=0)d.name=String(cell('name')).trim();if(m.rent>=0)d.rent=num(cell('rent'));if(m.balance>=0)d.balance=num(cell('balance'));if(m.paid>=0)d.paid=num(cell('paid'));
    if(m.ls>=0)d.leaseStart=pDate(cell('ls'));if(m.le>=0)d.leaseEnd=pDate(cell('le'));if(m.phone>=0)d.phone=String(cell('phone')).trim();if(m.email>=0)d.email=String(cell('email')).trim();
    if(m.hap>=0&&num(cell('hap'))>0){d.hapPortion=num(cell('hap'));d.assistProgram='Section 8 / HAP'}
    if(m.prog>=0&&String(cell('prog')).trim())d.assistProgram=String(cell('prog')).trim();if(m.agency>=0&&String(cell('agency')).trim())d.assistAgency=String(cell('agency')).trim();
    var id=prev||rid();existing[key]=id;jobs.push([id,d]);prev?updN++:newN++;
  }
  await batchRun(jobs,function(j){return put('tenants',j[0],j[1])},'Importando');
  toast('Listo: '+newN+' nuevos y '+updN+' actualizados.');
}

function csvCell(v){v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCSV(name,head,rows){
  if(!rows.length){toast('No hay datos para exportar.');return}
  var txt='﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
  if(!downloads){toast('La descarga no está disponible en esta vista.');return}
  try{await downloads.save({filename:name+'-'+TODAY+'.csv',data:txt});toast('Archivo listo')}catch(e){if(!e||e.code!=='declined')toast('No se pudo descargar el archivo.')}
}

  var B=[['Ejemplo · Brickell Palms LLC','1200 Brickell Ave, Miami, FL',10],['Ejemplo · Hialeah Gardens LLC','850 W 49th St, Hialeah, FL',10]];

  bids.forEach(function(bid,bi){for(var u=1;u<=10;u++){

    for(var k=3;k>=0;k--){var mo=addMonths(cur,-k);V.forEach(function(v,vi){var f=1+(rnd()-.4)*.25;if(vi===1&&k===0)f=1.38;if(vi===4)f=.4+rnd()*1.6;

/* ---------- eventos ---------- */
function go(v){ui.view=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-stop]'))return;
  var a=e.target.closest('[data-act]');if(a===null){if(e.target.id==='modal')closeModal();return}
  var act=a.dataset.act,id=a.dataset.id,v=a.dataset.v;
  if(a.tagName==='A')e.preventDefault();
  var need=['new-t','new-i','new-bld','save-t','save-i','save-b','del-t','del-i','del-b','demo','demo-clear','do-imp-t','do-imp-i'];
  if(need.indexOf(act)>=0&&!canWrite){toast('No tenés permiso de edición.');return}
  switch(act){
    case 'nav':go(v);break;
    case 'go-datos':go('datos');break;
    case 'tf':ui.tf=v;render();break;
    case 'cf':ui.cf=v;render();break;
    case 'close':closeModal();break;
    case 'new-t':if(!bOpts().length){toast('Primero agregá un edificio.');go('datos');break}tenantModal();break;
    case 'edit-t':tenantModal(id);break;
    case 'save-t':saveTenant(id);break;
    case 'del-t':if(a.dataset.sure){del('tenants',id);closeModal();toast('Inquilino eliminado')}else{a.dataset.sure=1;a.textContent='Confirmar eliminación'}break;
    case 'new-i':if(!bOpts().length){toast('Primero agregá un edificio.');go('datos');break}invoiceModal();break;
    case 'edit-i':invoiceModal(id);break;
    case 'save-i':saveInvoice(id);break;
    case 'del-i':if(a.dataset.sure){del('invoices',id);closeModal();toast('Factura eliminada')}else{a.dataset.sure=1;a.textContent='Confirmar eliminación'}break;
    case 'new-bld':buildingModal();break;
    case 'edit-b':buildingModal(id);break;
    case 'save-b':
      if(!gv('m-bname')){toast('Poné un nombre.');break}
      put('buildings',id||rid(),Object.assign({},id?S.buildings[id]:{},{name:gv('m-bname'),units:num(gv('m-units')),address:gv('m-addr')})).then(function(){closeModal();toast('Edificio guardado')});break;
    case 'del-b':
      if(list('tenants').some(function(t){return t.building===id})||list('invoices').some(function(x){return x.building===id})){toast('El edificio tiene inquilinos o facturas. Borralos antes.');break}
      if(a.dataset.sure){del('buildings',id);closeModal()}else{a.dataset.sure=1;a.textContent='Confirmar eliminación'}break;
    case 'exp-inv':exportInvoices();break;
    case 'exp-ten':exportTenants();break;
    case 'exp-con':exportContracts();break;
    case 'do-imp-t':importTenants();break;
    case 'do-imp-i':importInvoices();break;
    case 'demo':loadDemo();break;
    case 'demo-clear':clearDemo();break;
  }
});

  var t=e.target;
  if(t.dataset&&t.dataset.renew){if(!canWrite){toast('No tenés permiso de edición.');render();return}var o=Object.assign({},S.tenants[t.dataset.renew],{renewal:t.value});put('tenants',t.dataset.renew,o);toast('Renovación actualizada')}
  else if(t.id==='f-bld'){ui.bld=t.value;render()}
  else if(t.id==='f-month'){if(t.value){ui.month=t.value;render()}}
  else if(t.dataset&&t.dataset.ui==='igroup'){ui.igroup=t.value;render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(VIEWS.some(function(x){return x[0]===v})&&v!==ui.view){ui.view=v;render()}});
(function(){var v=location.hash.slice(1);if(VIEWS.some(function(x){return x[0]===v}))ui.view=v})();
safeRender();

/* ---------- movimiento con el cursor ---------- */
(function(){
  if(!window.matchMedia||!matchMedia('(hover:hover)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var cur=null;
  function reset(el){if(el){el.style.removeProperty('--rx');el.style.removeProperty('--ry')}}
  document.addEventListener('pointermove',function(e){
    var el=e.target.closest&&e.target.closest('.panel,.kpi');
    if(cur&&cur!==el)reset(cur);
    cur=el;if(!el)return;
    var r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    el.style.setProperty('--mx',x+'px');el.style.setProperty('--my',y+'px');
    if(el.classList.contains('kpi')){
      el.style.setProperty('--ry',((x/r.width-.5)*7).toFixed(2)+'deg');
      el.style.setProperty('--rx',((.5-y/r.height)*7).toFixed(2)+'deg');
    }
  },{passive:true});
  document.documentElement.addEventListener('pointerleave',function(){reset(cur);cur=null});
})();

/* ---------- arranque ---------- */
(async function(){
  // Nunca bloquear la pantalla esperando capacidades: a los 3 s se muestra la página igual.
  setTimeout(function(){if(!ui.loaded){ui.loaded=true;sched()}},3000);
  function cap(n){
    var c=window.claude;if(!c||!c.use)return Promise.resolve(null);
    return Promise.race([c.use(n).catch(function(){return null}),new Promise(function(r){setTimeout(function(){r(null)},8000)})]);
  }
  var got=await Promise.all([cap('db'),cap('assets'),cap('downloads'),cap('user')]);
  db=got[0];assets=got[1];downloads=got[2];
  try{var u=got[3];if(u&&u.can){var w=u.can('data.write');if(w===false)canWrite=false}}catch(e){}
  if(!db){memOnly=true;ui.loaded=true;render();return}
  var pending=3;
  ['buildings','tenants','invoices'].forEach(function(col){
    db.collection(col).onSnapshot(function(snap){
      var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});S[col]=m;
      if(pending>0){pending--;if(pending===0)ui.loaded=true}
      sched();
    },function(){memOnly=true;ui.loaded=true;sched()});
  });
})();
})();
</script>
